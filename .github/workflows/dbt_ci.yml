name: dbt CI

on:
  pull_request:
    paths:
      - "dbt/**"
      - ".github/workflows/dbt_ci.yml"
  push:
    branches: [main]
    paths:
      - "dbt/**"

env:
  DBT_PROJECT_DIR: dbt/pharma_dw

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install sqlfluff
        run: pip install "sqlfluff==3.1.*" "sqlfluff-templater-dbt==3.1.*"
      - name: Lint SQL (dbt templater, snowflake dialect)
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_CI_USER: ${{ secrets.SNOWFLAKE_CI_USER }}
          SNOWFLAKE_CI_PRIVATE_KEY_PATH: /tmp/sf_ci_key.p8
        run: |
          echo "${{ secrets.SNOWFLAKE_CI_PRIVATE_KEY }}" > /tmp/sf_ci_key.p8
          pip install "dbt-core==1.8.*" "dbt-snowflake==1.8.*"
          dbt deps
          sqlfluff lint models --dialect snowflake

  build_and_test:
    runs-on: ubuntu-latest
    needs: lint
    environment: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt
        run: pip install "dbt-core==1.8.*" "dbt-snowflake==1.8.*"
      - name: Write Snowflake CI key
        run: echo "${{ secrets.SNOWFLAKE_CI_PRIVATE_KEY }}" > /tmp/sf_ci_key.p8
      - name: dbt deps
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt deps
      - name: dbt parse (fast structural check)
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_CI_USER: ${{ secrets.SNOWFLAKE_CI_USER }}
          SNOWFLAKE_CI_PRIVATE_KEY_PATH: /tmp/sf_ci_key.p8
          DBT_PROFILES_DIR: ${{ env.DBT_PROJECT_DIR }}
        run: dbt parse --target ci
      - name: dbt seed + build (slim CI: state-aware, only modified + downstream)
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_CI_USER: ${{ secrets.SNOWFLAKE_CI_USER }}
          SNOWFLAKE_CI_PRIVATE_KEY_PATH: /tmp/sf_ci_key.p8
          DBT_PROFILES_DIR: ${{ env.DBT_PROJECT_DIR }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          dbt seed --target ci
          dbt snapshot --target ci
          # Slim CI: only build models changed vs. main + their downstream,
          # falling back to a full build when no prior-state manifest is
          # available (e.g. first run on a new CI schema).
          if [ -f /tmp/prod-manifest/manifest.json ]; then
            dbt build --target ci --select state:modified+ --defer --state /tmp/prod-manifest
          else
            dbt build --target ci
          fi
      - name: Drop ephemeral CI schema
        if: always()
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_CI_USER: ${{ secrets.SNOWFLAKE_CI_USER }}
          SNOWFLAKE_CI_PRIVATE_KEY_PATH: /tmp/sf_ci_key.p8
          DBT_PROFILES_DIR: ${{ env.DBT_PROJECT_DIR }}
        run: |
          dbt run-operation drop_schema_if_exists --target ci --args "{schema_name: ci_pr_${{ github.event.pull_request.number }}}" || true

  deploy_to_mwaa:
    runs-on: ubuntu-latest
    needs: build_and_test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Sync dbt project + Airflow DAGs to MWAA bucket
        run: |
          aws s3 sync dbt/pharma_dw/       s3://${{ secrets.MWAA_BUCKET }}/dags/dbt/pharma_dw/ --delete
          aws s3 sync airflow/dags/         s3://${{ secrets.MWAA_BUCKET }}/dags/ --exclude "*.pyc" --delete
          aws s3 cp    airflow/requirements.txt s3://${{ secrets.MWAA_BUCKET }}/requirements.txt
