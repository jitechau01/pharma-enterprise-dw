version: 2

models:
  - name: stg_crm__hcp_visit
    description: One row per rep<->HCP visit event (append-only, deduped by visit_id).
    columns:
      - name: visit_id
        tests: [not_null, unique]
      - name: rep_id
        tests: [not_null]
      - name: hcp_id
        tests: [not_null]
      - name: duration_minutes
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 480
